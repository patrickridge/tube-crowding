[project]
name = "tube-crowding"
version = "1.0.0"
description = "How busy is your tube station? Typical and live crowding from TfL open data."
requires-python = ">=3.11"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
