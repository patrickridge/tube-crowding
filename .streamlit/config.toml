[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f1f0ec"
textColor = "#0b0b0b"
font = "sans serif"

[client]
# Never show tracebacks to users; errors are logged server-side instead.
showErrorDetails = "none"
toolbarMode = "minimal"

[server]
headless = true
